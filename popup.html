<!doctype html>
<meta charset="utf-8">
<title>GMI</title>
<style>
  body { width: 260px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; background: #0d1117; color: #c9d1d9; }
  header, .row { display: flex; justify-content: space-between; align-items: center; }
  header { margin-bottom: 8px; }
  button { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; }
  .map { width: fit-content; margin: 0 auto; position: relative; }
  #grid, .wd { display: grid; grid-template-rows: repeat(7, 18px); grid-auto-flow: column; grid-auto-columns: 18px; gap: 3px; }
  .wd { position: absolute; right: calc(100% + 6px); grid-auto-columns: auto; font-size: 10px; color: #8b949e; line-height: 18px; }
  .day { background: #161b22; border-radius: 3px; padding: 0; }
  .day.sel { outline: 2px solid #58a6ff; }
  .today { box-shadow: inset 0 0 0 1px #8b949e; }
  .row { margin-top: 12px; color: #8b949e; }
  #plus { font-size: 18px; line-height: 1; padding: 0 4px; }
  ul { list-style: none; padding: 0; margin: 6px 0 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  li label { flex: 1; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  label:has(:disabled) { cursor: default; }
  input[type=checkbox] { accent-color: #26a641; }
  #stats, .empty { color: #8b949e; }
  #stats { font-size: 12px; margin-bottom: 8px; text-align: left; }
  .empty { margin: 8px 0 0; }
  form { display: flex; margin-top: 6px; }
  form[hidden], #plus[hidden] { display: none; }
  input[type=text] { flex: 1; background: #161b22; border: 1px solid #30363d; color: inherit; padding: 4px 6px; border-radius: 4px; }
</style>
<header><button id="prev">‹</button><b id="month"></b><button id="next">›</button></header>
<div id="stats"></div>
<div class="map"><div class="wd"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div><div id="grid"></div></div>
<div class="row"><span id="sel"></span><button id="plus" title="Add habit">+</button></div>
<form id="add" hidden><input type="text" id="name" placeholder="New habit, press Enter" required></form>
<ul id="habits"></ul>
<script src="popup.js"></script>
